<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280" role="img" aria-labelledby="title desc">
  <title id="title">Nimbus hierarchy</title>
  <desc id="desc">Organization contains projects; each project has environments, services, and resources.</desc>
  <rect width="700" height="280" fill="#0b1120"/>
  <rect x="240" y="20" width="220" height="44" rx="10" fill="#1a2640" stroke="#07a4fd" stroke-width="2"/>
  <text x="350" y="48" fill="#fff" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Organization</text>
  <rect x="240" y="90" width="220" height="44" rx="10" fill="#1a2640" stroke="#3b109e" stroke-width="2"/>
  <text x="350" y="118" fill="#fff" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Project</text>
  <rect x="40" y="180" width="180" height="60" rx="10" fill="#1a2640" stroke="#ff5c00" stroke-width="2"/>
  <text x="130" y="215" fill="#fff" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Environments</text>
  <rect x="260" y="180" width="180" height="60" rx="10" fill="#1a2640" stroke="#ff5c00" stroke-width="2"/>
  <text x="350" y="215" fill="#fff" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Services</text>
  <rect x="480" y="180" width="180" height="60" rx="10" fill="#1a2640" stroke="#ff5c00" stroke-width="2"/>
  <text x="570" y="215" fill="#fff" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Resources</text>
  <path d="M350 64 V90 M350 134 V180 M130 180 V160 H570 V180" stroke="#8992c1" stroke-width="2" fill="none"/>
</svg>
